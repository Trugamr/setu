# Releases a version tag (v1.2.3, matching Cargo.toml's version): builds the signed agent APK
# and the desktop app for Windows x64 and arm64, attaches them to a GitHub release, then deploys
# the browser installer with that same APK to setu.trugamr.dev. Run by hand (workflow_dispatch),
# it builds everything and stops before the release and the deploy.
#
# Secrets:
#   SETU_KEYSTORE_BASE64  the agent's release keystore, `base64 -w0 release.jks`
#   SETU_KEYSTORE_PASSWORD, SETU_KEY_PASSWORD  equal for a PKCS12 keystore, keytool's default
#   SETU_KEY_ALIAS
#     Every release must use the same key: Android refuses to update an app signed with a
#     different one, so losing it means every user uninstalls first.
#   CLOUDFLARE_API_TOKEN  from the "Edit Cloudflare Workers" template, with the trugamr.dev zone
#   CLOUDFLARE_ACCOUNT_ID
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't match Cargo.toml's version, $version. Bump it in a commit, then tag that commit."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  agent:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Build the signed APK
        env:
          SETU_KEYSTORE_BASE64: ${{ secrets.SETU_KEYSTORE_BASE64 }}
          SETU_KEYSTORE_PASSWORD: ${{ secrets.SETU_KEYSTORE_PASSWORD }}
          SETU_KEY_ALIAS: ${{ secrets.SETU_KEY_ALIAS }}
          SETU_KEY_PASSWORD: ${{ secrets.SETU_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          export SETU_KEYSTORE="$RUNNER_TEMP/setu.jks"
          base64 -d <<< "$SETU_KEYSTORE_BASE64" > "$SETU_KEYSTORE"
          ./gradlew assembleRelease -Psetu.version="$VERSION" --console=plain
          cp build/outputs/apk/release/setu-agent-release.apk "$RUNNER_TEMP/setu-agent.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-apk
          path: ${{ runner.temp }}/setu-agent.apk
          if-no-files-found: error
      # Decodes R8's renamed classes in stack traces from this release.
      - uses: actions/upload-artifact@v7
        with:
          name: agent-mapping
          path: apps/agent/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  desktop:
    needs: version
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          # Cross-compiled on the x64 runner, whose Visual Studio has the arm64 build tools.
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          $out = "target/${{ matrix.target }}/release"
          Compress-Archive -Path "$out/setu.exe", "$out/setu-cli.exe" `
            -DestinationPath "setu-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.arch }}
          path: setu-*.zip
          if-no-files-found: error

  github:
    if: github.ref_type == 'tag'
    needs: [agent, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent-apk
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      # Creates the release unless a re-run already did, then uploads, replacing any earlier
      # upload of the same file.
      - env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Install the agent on the headset from https://setu.trugamr.dev, then run `setu.exe`
            from the zip for your PC (x64, or arm64 for an Arm PC). See the README's Quick start.
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes "$NOTES" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  # After the GitHub release, so the page never serves an APK that has no release.
  web:
    if: github.ref_type == 'tag'
    needs: [agent, github]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://setu.trugamr.dev
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: agent-apk
          path: ${{ runner.temp }}/agent
      - run: SETU_AGENT_APK="$RUNNER_TEMP/agent/setu-agent.apk" pnpm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy
