# Releases a version tag (v1.2.3): builds the signed agent APK and the desktop app for Windows
# x64 and arm64, attaches them to a GitHub release, and deploys the browser installer with that
# same APK to setu.trugamr.dev.
#
# Secrets:
#   SETU_KEYSTORE_BASE64, SETU_KEYSTORE_PASSWORD, SETU_KEY_ALIAS, SETU_KEY_PASSWORD
#     the agent's release key. Every release must use the same one: Android refuses to update
#     an app signed with a different key.
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#     a token from the "Edit Cloudflare Workers" template, for the account holding trugamr.dev.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build the signed APK
        env:
          SETU_KEYSTORE_BASE64: ${{ secrets.SETU_KEYSTORE_BASE64 }}
          SETU_KEYSTORE_PASSWORD: ${{ secrets.SETU_KEYSTORE_PASSWORD }}
          SETU_KEY_ALIAS: ${{ secrets.SETU_KEY_ALIAS }}
          SETU_KEY_PASSWORD: ${{ secrets.SETU_KEY_PASSWORD }}
        run: |
          export SETU_KEYSTORE="$RUNNER_TEMP/setu.jks"
          base64 -d <<< "$SETU_KEYSTORE_BASE64" > "$SETU_KEYSTORE"
          ./gradlew assembleRelease -Psetu.version="${GITHUB_REF_NAME#v}" --console=plain
          cp build/outputs/apk/release/setu-agent-release.apk "$RUNNER_TEMP/setu-agent.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-apk
          path: ${{ runner.temp }}/setu-agent.apk
          if-no-files-found: error

  desktop:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          # Cross-compiled on the x64 runner, whose Visual Studio has the arm64 build tools.
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          $out = "target/${{ matrix.target }}/release"
          Compress-Archive -Path "$out/setu.exe", "$out/setu-cli.exe" `
            -DestinationPath "setu-${{ github.ref_name }}-windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.arch }}
          path: setu-*.zip
          if-no-files-found: error

  github:
    needs: [agent, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # After the GitHub release, so the page never serves an APK that has no release.
  web:
    needs: [agent, github]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://setu.trugamr.dev
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: agent-apk
          path: ${{ runner.temp }}/agent
      - run: SETU_AGENT_APK="$RUNNER_TEMP/agent/setu-agent.apk" pnpm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy
