# Tests and builds every push to main and every pull request. The Taskfile targets WSL, so the
# jobs call gradlew, pnpm and cargo directly.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The release build runs R8, so a missing keep rule fails here rather than at release.
      - run: ./gradlew testDebugUnitTest assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: agent-apk
          path: apps/agent/build/outputs/apk/release/*.apk
          if-no-files-found: error

  web:
    needs: agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: actions/download-artifact@v4
        with:
          name: agent-apk
          path: ${{ runner.temp }}/agent
      - run: SETU_AGENT_APK="$(ls "$RUNNER_TEMP"/agent/*.apk)" pnpm run build

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked
